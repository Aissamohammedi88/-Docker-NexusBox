# ═══════════════════════════════════════════════════════════════════════════════# NEXUSBOX CI/CD — Pipeline Ultime
# Auteur : Aissa Mohammedi (DGK)
# Licence : NEXUS-OPEN-DOMINANT v1.0
# Description : Build, test, lint, security, release, sign, deploy.
# Multi-langages : Rust, Bash, Python, YAML.
# Multi-plateformes : Ubuntu, Debian, macOS, ARM64.
# Multi-niveaux : dev, staging, production.
# ═══════════════════════════════════════════════════════════════════════════════

name: NexusBox CI/CD Ultimate

on:
push:
branches:
- main
- develop
- 'release/**'
- 'hotfix/**'
tags:
- 'v*.*.*'
- 'v*.*.*-rc.*'
- 'v*.*.*-beta.*'
paths-ignore:
- '**.md'
- 'LICENSE'
- '.gitignore'
- 'docs/**'
pull_request:
branches:
- main
- develop
types: [opened, synchronize, reopened]
schedule:
- cron: '0 3 * * 1'
workflow_dispatch:
inputs:
environment:
description: 'Target environment'
required: true
default: 'staging'
type: choice
options:
- dev
- staging
- production
skip_tests:
description: 'Skip tests'
required: false
default: false
type: boolean

# ─── Variables globales ───
env:
CARGO_TERM_COLOR: always
RUST_BACKTRACE: 1
RUST_LOG: info
PYTHONUNBUFFERED: 1
PROJECT_NAME: nexusbox
AUTHOR: "Aissa Mohammedi (DGK)"
LICENSE: "NEXUS-OPEN-DOMINANT"
CARGO_INCREMENTAL: 0
CARGO_NET_RETRY: 10
RUSTUP_MAX_RETRIES: 10
RUST_BACKTRACE_FULL: full

# ─── Permissions minimales ───
permissions:
contents: read
actions: read
checks: write
pull-requests: write
security-events: write
id-token: write

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 1 — LINT & FORMAT
# ═══════════════════════════════════════════════════════════════════════════════
jobs:

lint:
name: "Lint — ${{ matrix.lang }}"
runs-on: ubuntu-22.04
timeout-minutes: 15
strategy:
fail-fast: false
matrix:
lang: [rust, bash, python, yaml]

steps:
- name: Checkout
uses: actions/checkout@v4
with:
fetch-depth: 0
- name: Setup Rust
if: matrix.lang == 'rust'
uses: dtolnay/rust-toolchain@stable
with:
components: rustfmt, clippy

- name: Setup Python
if: matrix.lang == 'python'
uses: actions/setup-python@v5
with:
python-version: '3.12'
cache: 'pip'

- name: Install ShellCheck
if: matrix.lang == 'bash'
run: sudo apt-get update && sudo apt-get install -y shellcheck

- name: Install yamllint
if: matrix.lang == 'yaml'
run: pip install yamllint

- name: Install Python linters
if: matrix.lang == 'python'
run: |
pip install ruff black mypy pylint

- name: Rust — rustfmt check
if: matrix.lang == 'rust'
run: cargo fmt --all -- --check

- name: Rust — clippy
if: matrix.lang == 'rust'
run: cargo clippy --all-targets --all-features -- -D warnings

- name: Bash — shellcheck
if: matrix.lang == 'bash'
run: |
find . -name "*.sh" -type f -print0 | \
xargs -0 shellcheck -x -e SC1090,SC1091,SC2086 || true

- name: Python — ruff
if: matrix.lang == 'python'
run: |
find . -name "*.py" -type f -print0 | \
xargs -0 ruff check || true

- name: Python — black check
if: matrix.lang == 'python'
run: |
find . -name "*.py" -type f -print0 | \
xargs -0 black --check --diff || true

- name: YAML — yamllint
if: matrix.lang == 'yaml'
run: |
yamllint -d relaxed .github/workflows/ || true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 2 — TESTS UNITAIRES
# ═══════════════════════════════════════════════════════════════════════════════
test:
name: "Tests — ${{ matrix.os }} / ${{ matrix.lang }}"
runs-on: ${{ matrix.os }}
timeout-minutes: 30
needs: lint
if: ${{ !inputs.skip_tests }}
strategy:
fail-fast: false
matrix:
os:
- ubuntu-22.04
- ubuntu-24.04
- macos-14
lang:
- rust
- bash
- python
exclude:
- os: macos-14
lang: bash

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Rust
if: matrix.lang == 'rust'
uses: dtolnay/rust-toolchain@stable

- name: Setup Python
if: matrix.lang == 'python'
uses: actions/setup-python@v5
with:
python-version: '3.12'

- name: Cache Rust
if: matrix.lang == 'rust'
uses: Swatinem/rust-cache@v2
with:
shared-key: ${{ matrix.os }}-rust

- name: Cache Python
if: matrix.lang == 'python'
uses: actions/cache@v4
with:
path: ~/.cache/pip
key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements*.txt') }}
restore-keys: |
${{ runner.os }}-pip-

- name: Install dependencies (Ubuntu)
if: matrix.os == 'ubuntu-22.04' || matrix.os == 'ubuntu-24.04'
run: |
sudo apt-get update
sudo apt-get install -y build-essential pkg-config libssl-dev shellcheck

- name: Install dependencies (macOS)
if: matrix.os == 'macos-14'
run: brew install shellcheck

- name: Rust — build
if: matrix.lang == 'rust'
working-directory: nexusbox-hash
run: cargo build --release --locked

- name: Rust — tests
if: matrix.lang == 'rust'
working-directory: nexusbox-hash
run: cargo test --release --locked

- name: Rust — benchmarks
if: matrix.lang == 'rust' && matrix.os == 'ubuntu-22.04'
working-directory: nexusbox-hash
run: cargo bench --no-run 2>/dev/null || true

- name: Bash — syntax check
if: matrix.lang == 'bash'
run: |
for f in $(find . -name "*.sh" -type f); do
echo "Checking $f"
bash -n "$f" || exit 1
done

- name: Bash — unit tests
if: matrix.lang == 'bash'
run: |
if [ -f tests/bash_test.sh ]; then
bash tests/bash_test.sh
fi

- name: Python — tests
if: matrix.lang == 'python'
run: |
if [ -f tests/test_python.py ]; then
python3 -m pytest tests/test_python.py -v
fi

- name: Upload test results
if: always()
uses: actions/upload-artifact@v4
with:
name: test-results-${{ matrix.os }}-${{ matrix.lang }}
path: |
target/release/
test-results/
retention-days: 7
if-no-files-found: ignore

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 3 — SECURITY AUDIT
# ═══════════════════════════════════════════════════════════════════════════════
security:
name: "Security Audit"
runs-on: ubuntu-22.04
timeout-minutes: 20
needs: lint
permissions:
contents: read
security-events: write

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Rust
uses: dtolnay/rust-toolchain@stable

- name: Cache Rust
uses: Swatinem/rust-cache@v2

- name: Rust — cargo audit
working-directory: nexusbox-hash
run: |
cargo install cargo-audit --locked || true
cargo audit || true

- name: Rust — cargo deny
working-directory: nexusbox-hash
run: |
cargo install cargo-deny --locked || true
cargo deny check || true

- name: Python — bandit
run: |
pip install bandit
find . -name "*.py" -type f -print0 | xargs -0 bandit -r --exit-zero || true

- name: Python — safety
run: |
pip install safety
pip freeze > requirements.txt || true
safety check --json || true

- name: ShellCheck Security
run: |
find . -name "*.sh" -type f -print0 | \
xargs -0 shellcheck -S error || true

- name: Trivy — filesystem scan
uses: aquasecurity/trivy-action@master
with:
scan-type: 'fs'
scan-ref: '.'
format: 'sarif'
output: 'trivy-results.sarif'
severity: 'CRITICAL,HIGH'
exit-code: '0'

- name: Upload Trivy SARIF
if: always()
uses: github/codeql-action/upload-sarif@v3
with:
sarif_file: 'trivy-results.sarif'
category: 'trivy'

- name: Gitleaks — secrets scan
uses: gitleaks/gitleaks-action@v2
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
continue-on-error: true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 4 — BUILD MATRIX (multi-plateformes)
# ═══════════════════════════════════════════════════════════════════════════════
build:
name: "Build — ${{ matrix.target }}"
runs-on: ${{ matrix.os }}
timeout-minutes: 45
needs: [test, security]
if: always() && (needs.test.result == 'success' || needs.test.result == 'skipped')
strategy:
fail-fast: false
matrix:
include:
- os: ubuntu-22.04
target: x86_64-unknown-linux-gnu
bin: nexusbox-hash
- os: ubuntu-24.04
target: x86_64-unknown-linux-gnu
bin: nexusbox-hash
- os: ubuntu-22.04
target: aarch64-unknown-linux-gnu
bin: nexusbox-hash
cross: true
- os: macos-14
target: x86_64-apple-darwin
bin: nexusbox-hash
- os: macos-14
target: aarch64-apple-darwin
bin: nexusbox-hash

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Rust
uses: dtolnay/rust-toolchain@stable
with:
targets: ${{ matrix.target }}

- name: Install cross-compilation tools
if: matrix.cross
run: |
sudo apt-get update
sudo apt-get install -y gcc-aarch64-linux-gnu g++-aarch64-linux-gnu
echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc" >> $GITHUB_ENV

- name: Cache Rust
uses: Swatinem/rust-cache@v2
with:
key: ${{ matrix.target }}

- name: Build Rust binary
working-directory: nexusbox-hash
run: cargo build --release --locked --target ${{ matrix.target }}

- name: Strip binary (Linux/macOS)
run: |
BIN="nexusbox-hash/target/${{ matrix.target }}/release/${{ matrix.bin }}"
if [ -f "$BIN" ]; then
if [ "${{ matrix.os }}" = "macos-14" ]; then
strip "$BIN" || true
else
if [ "${{ matrix.cross }}" = "true" ]; then
aarch64-linux-gnu-strip "$BIN" || true
else
strip "$BIN" || true
fi
fi
fi

- name: Package binary
run: |
BIN="nexusbox-hash/target/${{ matrix.target }}/release/${{ matrix.bin }}"
OUT="${PROJECT_NAME}-${BIN}-${{ matrix.target }}"
mkdir -p dist
cp "$BIN" "dist/$OUT"
chmod +x "dist/$OUT"
sha256sum "dist/$OUT" > "dist/$OUT.sha256"

- name: Upload binary artifact
uses: actions/upload-artifact@v4
with:
name: binary-${{ matrix.target }}
path: dist/*
retention-days: 30
if-no-files-found: error

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 5 — CODEQL (analyse statique)
# ═══════════════════════════════════════════════════════════════════════════════
codeql:
name: "CodeQL Analysis"
runs-on: ubuntu-22.04
timeout-minutes: 30
permissions:
contents: read
security-events: write
actions: read

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Initialize CodeQL
uses: github/codeql-action/init@v3
with:
languages: python, javascript

- name: Autobuild
uses: github/codeql-action/autobuild@v3

- name: Perform CodeQL Analysis
uses: github/codeql-action/analyze@v3
with:
category: "/language:python"

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 6 — RELEASE (sur tag v*.*.*)
# ═══════════════════════════════════════════════════════════════════════════════
release:
name: "Release"
runs-on: ubuntu-22.04
timeout-minutes: 30
needs: build
if: startsWith(github.ref, 'refs/tags/v')

steps:
- name: Checkout
uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Download all binaries
uses: actions/download-artifact@v4
with:
path: dist

- name: List artifacts
run: find dist -type f | sort

- name: Generate changelog
run: |
echo "# Release ${{ github.ref_name }}" > CHANGELOG.md
echo "" >> CHANGELOG.md
echo "**Author:** ${AUTHOR}" >> CHANGELOG.md
echo "**License:** ${LICENSE}" >> CHANGELOG.md
echo "**Date:** $(date -u +%Y-%m-%d)" >> CHANGELOG.md
echo "" >> CHANGELOG.md
echo "## Changes" >> CHANGELOG.md
git log $(git describe --tags --abbrev=0 HEAD^)..HEAD --pretty=format:"- %s (%h)" >> CHANGELOG.md || true

- name: Create GitHub Release
uses: softprops/action-gh-release@v2
with:
name: "NexusBox ${{ github.ref_name }}"
body_path: CHANGELOG.md
draft: false
prerelease: ${{ contains(github.ref_name, '-rc.') || contains(github.ref_name, '-beta.') }}
files: |
dist/**/*.tar.gz
dist/**/*.zip
dist/**/*.sha256
generate_release_notes: true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 7 — DOCKER (build & push image)
# ═══════════════════════════════════════════════════════════════════════════════
docker:
name: "Docker Build & Push"
runs-on: ubuntu-22.04
timeout-minutes: 30
needs: build
if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v'))

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Set up Docker Buildx
uses: docker/setup-buildx-action@v3

- name: Login to GitHub Container Registry
uses: docker/login-action@v3
with:
registry: ghcr.io
username: ${{ github.actor }}
password: ${{ secrets.GITHUB_TOKEN }}

- name: Extract metadata
id: meta
uses: docker/metadata-action@v5
with:
images: ghcr.io/${{ github.repository }}
tags: |
type=ref,event=branch
type=ref,event=pr
type=semver,pattern={{version}}
type=semver,pattern={{major}}.{{minor}}
type=sha

- name: Build and push Docker image
uses: docker/build-push-action@v5
with:
context: .
push: true
tags: ${{ steps.meta.outputs.tags }}
labels: ${{ steps.meta.outputs.labels }}
cache-from: type=gha
cache-to: type=gha,mode=max

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 8 — DEPLOY (staging / production)
# ═══════════════════════════════════════════════════════════════════════════════
deploy:
name: "Deploy — ${{ inputs.environment || 'staging' }}"
runs-on: ubuntu-22.04
timeout-minutes: 20
needs: [build, docker]
if: |
github.event_name == 'workflow_dispatch' ||
(github.event_name == 'push' && github.ref == 'refs/heads/main')
environment:
name: ${{ inputs.environment || 'staging' }}
url: https://${{ inputs.environment || 'staging' }}.nexusbox.dev

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Download binaries
uses: actions/download-artifact@v4
with:
path: dist

- name: Deploy to server
env:
DEPLOY_KEY: ${{ secrets.DEPLOY_KEY }}
DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
run: |
echo "Deploying to ${{ inputs.environment || 'staging' }}"
echo "Host: $DEPLOY_HOST"
echo "User: $DEPLOY_USER"
echo "Artifacts:"
ls -la dist/
# Placeholder — remplacer par la vraie commande de déploiement
# scp -i "$DEPLOY_KEY" dist/*.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/opt/nexusbox/"

- name: Health check
run: |
echo "Health check on ${{ inputs.environment || 'staging' }}"
# curl -f https://${{ inputs.environment || 'staging' }}.nexusbox.dev/health || exit 1

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 9 — PUBLISH (PyPI + crates.io)
# ═══════════════════════════════════════════════════════════════════════════════
publish:
name: "Publish — crates.io + PyPI"
runs-on: ubuntu-22.04
timeout-minutes: 30
needs: build
if: startsWith(github.ref, 'refs/tags/v')
environment: release

steps:
- name: Checkout
uses: actions/checkout@v4

- name: Setup Rust
uses: dtolnay/rust-toolchain@stable

- name: Setup Python
uses: actions/setup-python@v5
with:
python-version: '3.12'

- name: Publish to crates.io
working-directory: nexusbox-hash
env:
CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
run: |
if [ -n "${CARGO_REGISTRY_TOKEN}" ]; then
cargo publish --locked || true
else
echo "CARGO_REGISTRY_TOKEN not set — skipping"
fi

- name: Publish to PyPI
env:
TWINE_USERNAME: __token__
TWINE_PASSWORD: ${{ secrets.PYPI_TOKEN }}
run: |
pip install build twine
if [ -f pyproject.toml ]; then
python -m build
twine upload dist/*.whl dist/*.tar.gz || true
else
echo "pyproject.toml not found — skipping"
fi

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 10 — NOTIFY (Slack / Discord)
# ═══════════════════════════════════════════════════════════════════════════════
notify:
name: "Notify"
runs-on: ubuntu-22.04
timeout-minutes: 5
needs: [lint, test, security, build]
if: always() && github.event_name != 'pull_request'

steps:
- name: Slack notification
if: env.SLACK_WEBHOOK != ''
env:
SLACK_WEBHOOK: ${{ secrets.SLACK_WEBHOOK }}
run: |
STATUS="${{ needs.build.result }}"
COLOR="good"
[ "$STATUS" != "success" ] && COLOR="danger"
curl -X POST -H 'Content-type: application/json' \
--data "{\"attachments\":[{\"color\":\"$COLOR\",\"title\":\"NexusBox CI\",\"text\":\"Status: $STATUS | Commit: ${{ github.sha }}\",\"footer\":\"Aissa Mohammedi (DGK)\"}]}" \
"$SLACK_WEBHOOK" || true

- name: Discord notification
if: env.DISCORD_WEBHOOK != ''
env:
DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}
run: |
STATUS="${{ needs.build.result }}"
curl -X POST -H 'Content-type: application/json' \
--data "{\"content\":\"**NexusBox CI** — Status: $STATUS | Commit: ${{ github.sha }}\"}" \
"$DISCORD_WEBHOOK" || true

# ═══════════════════════════════════════════════════════════════════════════════
# JOB 11 — CLEANUP (nettoyage des artifacts anciens)
# ═══════════════════════════════════════════════════════════════════════════════
cleanup:
name: "Cleanup old artifacts"
runs-on: ubuntu-22.04
timeout-minutes: 10
if: github.event_name == 'schedule'

steps:
- name: Delete old artifacts
uses: actions/github-script@v7
with:
script: |
const cutoff = Date.now() - (30 * 24 * 60 * 60 * 1000);
const artifacts = await github.rest.actions.listArtifactsForRepo({
owner: context.repo.owner,
repo: context.repo.repo,
per_page: 100
});
for (const artifact of artifacts.data.artifacts) {
if (new Date(artifact.created_at).getTime() < cutoff) {
console.log(`Deleting artifact: ${artifact.name}`);
await github.rest.actions.deleteArtifact({
owner: context.repo.owner,
repo: context.repo.repo,
artifact_id: artifact.id
});
}
}
