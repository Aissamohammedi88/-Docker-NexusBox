Étape 3 — Compiler :
cargo build --release

Étape 4 — Rendre les scripts exécutables :
chmod +x ~/Documents/nexus_blanche_net/nexusbox-layer.sh
chmod +x ~/Documents/nexus_blanche_net/nexusbox-metrics.py

Étape 5 — Lancer le dashboard :
python3 ~/Documents/nexus_blanche_net/nexusbox-metrics.py

Puis ouvre Safari :
http://127.0.0.1:10500/

Étape 6 — Utiliser les layers :
# Compiler le binaire Rust via le script
~/Documents/nexus_blanche_net/nexusbox-layer.sh build

# Créer un snapshot
~/Documents/nexus_blanche_net/nexusbox-layer.sh snapshot demo backup-1 "Premier snapshot"

# Lister
~/Documents/nexus_blanche_net/nexusbox-layer.sh list demo

# Comparer deux snapshots
~/Documents/nexus_blanche_net/nexusbox-layer.sh diff demo backup-1 backup-2

# Rollback
~/Documents/nexus_blanche_net/nexusbox-layer.sh rollback demo backup-1

# Stats
~/Documents/nexus_blanche_net/nexusbox-layer.sh stats

