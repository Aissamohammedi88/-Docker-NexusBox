# ═══════════════════════════════════════════════════════════════════════════════# NEXUSBOX CI/CD — Enterprise Grade Pipeline
# Auteur : Aissa Mohammedi (DGK)
# Licence : NEXUS-OPEN-DOMINANT v1.0
# Project : NexusBox — Alternative à Docker
# Stack : Bash + Rust + Python + YAML
# ═══════════════════════════════════════════════════════════════════════════════
name: NexusBox CI/CD

on:
push:
branches: [main, develop, "release/**", "feature/**", "hotfix/**"]
paths-ignore:
- "**.md"
- "LICENSE"
- "docs/**"
pull_request:
branches: [main, develop]
schedule:
- cron: "0 3 * * *"
workflow_dispatch:
inputs:
release:
description: "Créer une release"
required: false
default: "false"
skip_tests:
description: "Sauter les tests (déconseillé)"
required: false
default: "false"

permissions:
contents: write
packages: write
issues: write
pull-requests: write
security-events: write

concurrency:
group: ${{ github.workflow }}-${{ github.ref }}
cancel-in-progress: true

env:
CARGO_TERM_COLOR: always
RUST_BACKTRACE: 1
PYTHON_VERSION: "3.11"
RUST_VERSION: "stable"
NEXUS_VERSION: "1.0.0"

# ═══════════════════════════════════════════════════════════════════════════════
# JOBS
# ═══════════════════════════════════════════════════════════════════════════════
jobs:

# ─── 1. VALIDATION MÉTADONNÉES ───
metadata:
name: "Metadata & Version"
runs-on: ubuntu-22.04
outputs:
version: ${{ steps.version.outputs.version }}
changelog: ${{ steps.changelog.outputs.changelog }}
branch: ${{ steps.branch.outputs.branch }}
steps:
- uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Extract branch
id: branch
run: |
echo "branch=${GITHUB_REF#refs/heads/}" >> $GITHUB_OUTPUT

- name: Compute version
id: version
run: |
VERSION=$(grep -oP 'VERSION="\K[^"]+' nexusbox.sh 2>/dev/null | head -1 || echo "1.0.0")
SHA=$(git rev-parse --short HEAD)
echo "version=${VERSION}+${SHA}" >> $GITHUB_OUTPUT

- name: Generate changelog
id: changelog
run: |
{
echo "changelog<<EOF"
git log --pretty=format:"- %s (%h)" $(git describe --tags --abbrev=0 2>/dev/null || echo "HEAD~20")..HEAD 2>/dev/null || git log --oneline -20
echo ""
echo "EOF"
} >> $GITHUB_OUTPUT

# ─── 2. LINT BASH ───
lint-bash:
name: "Lint Bash"
runs-on: ubuntu-22.04
needs: metadata
steps:
- uses: actions/checkout@v4

- name: Install shellcheck
run: sudo apt-get update && sudo apt-get install -y shellcheck

- name: ShellCheck
run: |
find . -type f -name "*.sh" -not -path "./target/*" -not -path "./venv/*" | while read -r f; do
echo "▶ Checking $f"
shellcheck -S warning "$f" || true
done

- name: Bash syntax check
run: |
find . -type f -name "*.sh" -exec bash -n {} \;
echo "✅ All shell scripts valid"

- name: Verify executables
run: |
find . -type f -name "*.sh" ! -perm -u+x -print | while read -r f; do
echo "⚠️ $f is not executable"
done

# ─── 3. LINT RUST ───
lint-rust:
name: "Lint Rust"
runs-on: ubuntu-22.04
needs: metadata
steps:
- uses: actions/checkout@v4

- name: Install Rust
uses: dtolnay/rust-toolchain@stable
with:
components: rustfmt, clippy

- name: Cache Cargo
uses: actions/cache@v4
with:
path: |
~/.cargo/bin/
~/.cargo/registry/index/
~/.cargo/registry/cache/
~/.cargo/git/db/
target/
key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
restore-keys: ${{ runner.os }}-cargo-

- name: Rustfmt
working-directory: ./nexusbox-hash
run: cargo fmt --all -- --check

- name: Clippy
working-directory: ./nexusbox-hash
run: cargo clippy --all-targets --all-features -- -D warnings

- name: Build
working-directory: ./nexusbox-hash
run: cargo build --release --verbose

- name: Test
working-directory: ./nexusbox-hash
run: cargo test --release --verbose

- name: Upload binary
uses: actions/upload-artifact@v4
with:
name: nexusbox-hash-${{ needs.metadata.outputs.version }}
path: nexusbox-hash/target/release/nexusbox-hash
retention-days: 30

# ─── 4. LINT PYTHON ───
lint-python:
name: "Lint Python"
runs-on: ubuntu-22.04
needs: metadata
strategy:
matrix:
python: ["3.10", "3.11", "3.12", "3.13"]
steps:
- uses: actions/checkout@v4

- name: Setup Python ${{ matrix.python }}
uses: actions/setup-python@v5
with:
python-version: ${{ matrix.python }}
cache: pip

- name: Install tools
run: |
pip install --upgrade pip
pip install flake8 pylint black mypy bandit radon

- name: Black check
run: black --check --diff . || true

- name: Flake8
run: |
flake8 . --count --select=E9,F63,F7,F82 --show-source --statistics
flake8 . --count --exit-zero --max-complexity=15 --max-line-length=127

- name: MyPy
run: mypy --ignore-missing-imports --no-error-summary . || true

- name: Bandit security
run: bandit -r . -ll -x ./venv,./target || true

- name: Radon complexity
run: radon cc . -a -s --total-average || true

# ─── 5. VALIDATION YAML ───
lint-yaml:
name: "Lint YAML"
runs-on: ubuntu-22.04
needs: metadata
steps:
- uses: actions/checkout@v4

- name: Install yamllint
run: pip install yamllint

- name: Validate YAML
run: |
find . -type f \( -name "*.yml" -o -name "*.yaml" \) | while read -r f; do
echo "▶ $f"
yamllint -d relaxed "$f" || true
done

- name: Validate JSON
run: |
find . -type f -name "*.json" -not -path "./node_modules/*" | while read -r f; do
python3 -m json.tool "$f" > /dev/null && echo "✅ $f" || echo "❌ $f"
done

# ─── 6. TESTS FONCTIONNELS ───
tests:
name: "Functional Tests"
runs-on: ubuntu-22.04
needs: [metadata, lint-bash, lint-rust]
if: github.event.inputs.skip_tests != 'true'
steps:
- uses: actions/checkout@v4

- name: Download Rust binary
uses: actions/download-artifact@v4
with:
name: nexusbox-hash-${{ needs.metadata.outputs.version }}
path: /tmp/nexus-bin

- name: Setup environment
run: |
mkdir -p ~/.nexusbox/bin
cp /tmp/nexus-bin/nexusbox-hash ~/.nexusbox/bin/
chmod +x ~/.nexusbox/bin/nexusbox-hash
sudo apt-get update
sudo apt-get install -y iproute2 iptables util-linux
sudo sysctl -w net.ipv4.ip_forward=1

- name: Test Rust binary
run: |
~/.nexusbox/bin/nexusbox-hash version
~/.nexusbox/bin/nexusbox-hash hash /etc > /tmp/test_hash.txt
echo "✅ Hash computed: $(cat /tmp/test_hash.txt)"

- name: Test Bash scripts
run: |
bash -n nexusbox.sh
bash -n nexusbox-network.sh
bash -n nexusbox-layer.sh
echo "✅ All bash scripts valid"

- name: Test Python scripts
run: |
python3 -m py_compile nexusbox-metrics.py
python3 -m py_compile nexus-kernel-report.py 2>/dev/null || true
echo "✅ Python scripts compile"

- name: Test shellcheck strict
run: |
shellcheck -S error nexusbox.sh || exit 1

# ─── 7. TESTS INTÉGRATION ───
integration:
name: "Integration Tests"
runs-on: ubuntu-22.04
needs: [tests]
steps:
- uses: actions/checkout@v4

- name: Setup NexusBox
run: |
mkdir -p ~/.nexusbox/{boxes,snapshots,layers,tags,bin,logs}
cp nexusbox.sh ~/.nexusbox/bin/ 2>/dev/null || true

- name: Simulate create
run: |
mkdir -p ~/.nexusbox/templates/alpine-mini.rootfs
echo "test" > ~/.nexusbox/templates/alpine-mini.rootfs/test.txt

- name: Verify structure
run: |
test -d ~/.nexusbox/boxes && echo "✅ boxes"
test -d ~/.nexusbox/snapshots && echo "✅ snapshots"
test -d ~/.nexusbox/layers && echo "✅ layers"

# ─── 8. AUDIT SÉCURITÉ ───
security:
name: "Security Audit"
runs-on: ubuntu-22.04
needs: metadata
permissions:
security-events: write
steps:
- uses: actions/checkout@v4

- name: Run Trivy
uses: aquasecurity/trivy-action@master
with:
scan-type: fs
scan-ref: .
format: sarif
output: trivy-results.sarif
continue-on-error: true

- name: Upload Trivy
uses: github/codeql-action/upload-sarif@v3
with:
sarif_file: trivy-results.sarif
continue-on-error: true

- name: Check secrets
run: |
find . -type f \( -name "*.py" -o -name "*.sh" -o -name "*.rs" \) -not -path "./target/*" | \
xargs grep -l "password\|api_key\|secret\|token" 2>/dev/null | head -10 || \
echo "✅ No obvious secrets"

- name: Generate SBOM
run: |
echo "# SBOM NexusBox v${{ needs.metadata.outputs.version }}" > sbom.md
echo "Generated: $(date -u)" >> sbom.md
echo "" >> sbom.md
echo "## Bash" >> sbom.md
grep -h "^# Version" *.sh 2>/dev/null >> sbom.md || true
echo "" >> sbom.md
echo "## Rust" >> sbom.md
grep -A1 '^\[dependencies\]' nexusbox-hash/Cargo.toml 2>/dev/null >> sbom.md || true

- name: Upload SBOM
uses: actions/upload-artifact@v4
with:
name: sbom-${{ needs.metadata.outputs.version }}
path: sbom.md

# ─── 9. BENCHMARKS ───
benchmarks:
name: "Benchmarks"
runs-on: ubuntu-22.04
needs: [metadata, lint-rust]
if: github.event_name == 'schedule' || github.event.inputs.release == 'true'
steps:
- uses: actions/checkout@v4

- name: Install Rust
uses: dtolnay/rust-toolchain@stable

- name: Benchmark hashing
working-directory: ./nexusbox-hash
run: |
cargo build --release
TIME_START=$(date +%s%N)
./target/release/nexusbox-hash hash /usr/share/doc > /dev/null 2>&1 || true
TIME_END=$(date +%s%N)
echo "Hash time: $(( (TIME_END - TIME_START) / 1000000 )) ms"

- name: Benchmark 100 runs
run: |
for i in $(seq 1 100); do
/usr/bin/time -f "%e" ./nexusbox-hash/target/release/nexusbox-hash hash /etc 2>> /tmp/bench.txt > /dev/null
done
echo "Average: $(awk '{s+=$1; n++} END {print s/n}' /tmp/bench.txt) s"

- name: Upload benchmark results
uses: actions/upload-artifact@v4
with:
name: benchmarks-${{ needs.metadata.outputs.version }}
path: /tmp/bench.txt

# ─── 10. BUILD MATRIX ───
build-matrix:
name: "Build ${{ matrix.os }} / ${{ matrix.arch }}"
runs-on: ${{ matrix.os }}
needs: [metadata, lint-rust]
strategy:
fail-fast: false
matrix:
include:
- os: ubuntu-22.04
arch: x86_64
target: x86_64-unknown-linux-gnu
- os: ubuntu-22.04-arm
arch: aarch64
target: aarch64-unknown-linux-gnu
- os: ubuntu-24.04
arch: x86_64
target: x86_64-unknown-linux-gnu
steps:
- uses: actions/checkout@v4

- name: Install Rust
uses: dtolnay/rust-toolchain@stable
with:
targets: ${{ matrix.target }}

- name: Build for ${{ matrix.target }}
working-directory: ./nexusbox-hash
run: cargo build --release --target ${{ matrix.target }}

- name: Strip binary
run: |
strip nexusbox-hash/target/${{ matrix.target }}/release/nexusbox-hash || true

- name: Upload artifact
uses: actions/upload-artifact@v4
with:
name: nexusbox-hash-${{ matrix.os }}-${{ matrix.arch }}
path: nexusbox-hash/target/${{ matrix.target }}/release/nexusbox-hash

# ─── 11. COVERAGE ───
coverage:
name: "Code Coverage"
runs-on: ubuntu-22.04
needs: [metadata, lint-rust]
steps:
- uses: actions/checkout@v4

- name: Install Rust
uses: dtolnay/rust-toolchain@stable
with:
components: llvm-tools-preview

- name: Install tarpaulin
run: cargo install cargo-tarpaulin

- name: Generate coverage
working-directory: ./nexusbox-hash
run: cargo tarpaulin --out Xml --out Html --output-dir coverage || true

- name: Upload coverage
uses: actions/upload-artifact@v4
with:
name: coverage-${{ needs.metadata.outputs.version }}
path: nexusbox-hash/coverage/

- name: Upload to Codecov
uses: codecov/codecov-action@v4
with:
files: ./nexusbox-hash/coverage/cobertura.xml
fail_ci_if_error: false
continue-on-error: true

# ─── 12. RELEASE ───
release:
name: "Release"
runs-on: ubuntu-22.04
needs: [metadata, lint-bash, lint-rust, lint-python, lint-yaml, tests, security, build-matrix]
if: startsWith(github.ref, 'refs/tags/v') || github.event.inputs.release == 'true'
permissions:
contents: write
steps:
- uses: actions/checkout@v4
with:
fetch-depth: 0

- name: Download all artifacts
uses: actions/download-artifact@v4
with:
path: artifacts/

- name: Organize release assets
run: |
mkdir -p release/
find artifacts/ -type f -executable -exec cp {} release/ \;
find artifacts/ -type f \( -name "*.md" -o -name "*.json" \) -exec cp {} release/ \;
ls -la release/

- name: Compute SHA-256 for all assets
run: |
cd release/
sha256sum * > SHA256SUMS
cat SHA256SUMS

- name: Generate release notes
run: |
{
echo "# NexusBox ${{ needs.metadata.outputs.version }}"
echo ""
echo "## Changements"
echo "${{ needs.metadata.outputs.changelog }}"
echo ""
echo "## Assets"
echo ""
ls release/ | while read f; do
echo "- \`$f\`"
done
echo ""
echo "## License"
echo "NEXUS-OPEN-DOMINANT v1.0"
echo ""
echo "**Powered by NexusBox — Aissa Mohammedi (DGK)**"
} > RELEASE_NOTES.md

- name: Create GitHub Release
uses: softprops/action-gh-release@v2
with:
name: "NexusBox v${{ needs.metadata.outputs.version }}"
body_path: RELEASE_NOTES.md
files: |
release/*
draft: false
prerelease: false
env:
GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

# ─── 13. PUBLISH BINAIRE ───
publish-binary:
name: "Publish Binary"
runs-on: ubuntu-22.04
needs: [release]
if: startsWith(github.ref, 'refs/tags/v')
steps:
- uses: actions/checkout@v4

- name: Download artifacts
uses: actions/download-artifact@v4
with:
path: artifacts/

- name: Prepare publish
run: |
mkdir -p publish/
find artifacts/ -type f -executable -exec cp {} publish/ \;
ls -la publish/

- name: Commit to publish branch
run: |
git config user.name "NexusBot"
git config user.email "bot@nexus.local"
git checkout -b publish-${{ github.sha }} || git checkout publish-${{ github.sha }}
mkdir -p binaries/
cp publish/* binaries/ 2>/dev/null || true
git add binaries/
git commit -m "Publish binaries v${{ needs.metadata.outputs.version }}" || echo "No changes"
git push origin publish-${{ github.sha }} || true

# ─── 14. NOTIFICATION FINALE ───
notify:
name: "Final Notification"
runs-on: ubuntu-22.04
needs: [metadata, lint-bash, lint-rust, lint-python, lint-yaml, tests, security, benchmarks]
if: always()
steps:
- name: Status summary
run: |
echo "═══════════════════════════════════════════"
echo " NEXUSBOX CI/CD — RÉSUMÉ"
echo "═══════════════════════════════════════════"
echo " Version : ${{ needs.metadata.outputs.version }}"
echo " Branche : ${{ needs.metadata.outputs.branch }}"
echo " Commit : ${{ github.sha }}"
echo " Auteur : ${{ github.actor }}"
echo "═══════════════════════════════════════════"
echo ""

- name: Check all jobs
run: |
FAILED=0
[ "${{ needs.lint-bash.result }}" != "success" ] && FAILED=$((FAILED + 1))
[ "${{ needs.lint-rust.result }}" != "success" ] && FAILED=$((FAILED + 1))
[ "${{ needs.lint-python.result }}" != "success" ] && FAILED=$((FAILED + 1))
[ "${{ needs.tests.result }}" != "success" ] && FAILED=$((FAILED + 1))
[ "${{ needs.security.result }}" != "success" ] && FAILED=$((FAILED + 1))
if [ "$FAILED" -gt 0 ]; then
echo "❌ $FAILED job(s) failed"
exit 1
fi
echo "✅ All jobs passed"

- name: Success message
if: success()
run: |
echo "✅ NexusBox CI passed on ${{ github.ref }}"
echo " Aissa Mohammedi (DGK) — NEXUS-OPEN-DOMINANT License"
